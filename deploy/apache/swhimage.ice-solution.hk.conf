# Apache2 VirtualHost for swhimage.ice-solution.hk
# Cloudflare SSL mode: Flexible (edge HTTPS → origin HTTP :80)
#
# Enable modules:
#   sudo a2enmod proxy proxy_http headers rewrite
# Install:
#   sudo cp deploy/apache/swhimage.ice-solution.hk.conf /etc/apache2/sites-available/
#   sudo a2ensite swhimage.ice-solution.hk.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName swhimage.ice-solution.hk
    ServerAdmin admin@ice-solution.hk

    # Cloudflare Flexible: browser→CF is HTTPS, CF→origin is HTTP.
    # Tell the Node app the original scheme so generated URLs use https://
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPreserveHost On
    ProxyRequests Off

    # Node.js Express (adjust port if needed)
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Allow larger image uploads (match multer 10MB + multipart overhead)
    LimitRequestBody 15728640

    ErrorLog ${APACHE_LOG_DIR}/swhimage-error.log
    CustomLog ${APACHE_LOG_DIR}/swhimage-access.log combined
</VirtualHost>
